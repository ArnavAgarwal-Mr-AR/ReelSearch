<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#05070a;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-blue {
        stroke-dasharray: 8 16;
        animation: flowBlue 2s linear infinite;
      }
      .pulse-green {
        stroke-dasharray: 8 16;
        animation: flowGreen 2s linear infinite;
      }
      .pulse-amber {
        stroke-dasharray: 8 16;
        animation: flowAmber 2s linear infinite;
      }
      .node-card {
        transition: transform 0.2s ease;
      }
      .pulse-beacon {
        animation: beaconGlow 2.5s ease-in-out infinite;
      }
      @keyframes flowBlue {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowGreen {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowAmber {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes beaconGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
    </style>
  </defs>

  <!-- Background Grid -->
  <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0e131d" stroke-width="1"/>
  </pattern>
  <rect width="960" height="540" fill="url(#gridPattern)" />

  <!-- Header Section -->
  <text x="480" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="1">REELSEARCH — END-TO-END HYBRID DISCOVERY PIPELINE</text>
  <text x="480" y="58" text-anchor="middle" fill="#64748b" font-size="11" font-weight="500">Autonomous Metadata Ingestion, Adaptive Context Gating, and Sub-40ms Dual-Retriever</text>

  <!-- ==================== FLOW 1: INGESTION PIPELINE (TOP/LEFT) ==================== -->
  <!-- Connector: Client -> Ingestion Gateway -->
  <path d="M 230 115 L 230 160" fill="none" stroke="#2563eb" stroke-width="2" class="pulse-blue" />
  <!-- Connector: Ingestion Gateway -> Canonicalizer -->
  <path d="M 230 205 L 230 240" fill="none" stroke="#2563eb" stroke-width="2" class="pulse-blue" />
  <!-- Connector: Canonicalizer -> Outbox / Neon -->
  <path d="M 230 285 L 230 320" fill="none" stroke="#2563eb" stroke-width="2" class="pulse-blue" />
  <!-- Connector: Outbox -> Adaptive Worker -->
  <path d="M 230 365 L 230 405" fill="none" stroke="#10b981" stroke-width="2" class="pulse-green" />
  <!-- Connector: Adaptive Worker -> LLM / Local Gating -->
  <path d="M 315 435 L 390 435" fill="none" stroke="#10b981" stroke-width="2" class="pulse-green" />
  <!-- Connector: Gating -> Vector & FTS Index -->
  <path d="M 480 405 L 480 340" fill="none" stroke="#10b981" stroke-width="2" class="pulse-green" />

  <!-- ==================== FLOW 2: SEARCH PIPELINE (RIGHT) ==================== -->
  <!-- Connector: Client -> L1/L2 Cache -->
  <path d="M 730 115 L 730 160" fill="none" stroke="#3b82f6" stroke-width="2" class="pulse-blue" />
  <!-- Connector: L1/L2 Cache -> Query Engine -->
  <path d="M 730 205 L 730 240" fill="none" stroke="#3b82f6" stroke-width="2" class="pulse-blue" />
  <!-- Connector: Query Engine Split to DB Index -->
  <path d="M 645 262 L 565 295" fill="none" stroke="#f59e0b" stroke-width="2" class="pulse-amber" />
  <!-- Connector: DB Index Return -> Fusion & Rerank -->
  <path d="M 565 315 L 645 350" fill="none" stroke="#f59e0b" stroke-width="2" class="pulse-amber" />
  <!-- Connector: Fusion -> Confidence Gate -->
  <path d="M 730 375 L 730 410" fill="none" stroke="#3b82f6" stroke-width="2" class="pulse-blue" />
  <!-- Connector: Confidence Gate -> Top 4 Output -->
  <path d="M 730 455 L 730 485" fill="none" stroke="#10b981" stroke-width="2" class="pulse-green" />

  <!-- ==================== UI CLIENT (TOP CENTER) ==================== -->
  <g class="node-card" transform="translate(360, 75)">
    <rect width="240" height="42" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="42" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5" class="pulse-beacon" />
    <circle cx="20" cy="21" r="5" fill="#3b82f6"/>
    <text x="35" y="25" fill="#ffffff" font-size="12" font-weight="700">Web Client (Minimalist UI)</text>
    <text x="195" y="25" fill="#94a3b8" font-size="10" font-family="monospace">SPA</text>
  </g>
  <!-- Client routing lines -->
  <path d="M 400 117 L 230 117" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 560 117 L 730 117" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="280" y="110" fill="#60a5fa" font-size="9.5" font-family="monospace">POST /reels (URL)</text>
  <text x="605" y="110" fill="#60a5fa" font-size="9.5" font-family="monospace">GET /search?q=...</text>

  <!-- ==================== INGESTION NODES (LEFT) ==================== -->
  <!-- 1. Save Gateway -->
  <g class="node-card" transform="translate(130, 160)">
    <rect width="200" height="45" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <text x="15" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">1. Ingestion Gateway</text>
    <text x="15" y="36" fill="#64748b" font-size="9.5">SSRF Validation &amp; Rate Limit</text>
    <rect x="150" y="14" width="38" height="16" rx="3" fill="#0f1d33" stroke="#2563eb" stroke-width="0.8"/>
    <text x="156" y="26" fill="#60a5fa" font-size="8.5" font-family="monospace">202 OK</text>
  </g>

  <!-- 2. Deterministic Canonicalizer -->
  <g class="node-card" transform="translate(130, 240)">
    <rect width="200" height="45" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <text x="15" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">2. URL Canonicalizer</text>
    <text x="15" y="36" fill="#64748b" font-size="9.5">Deterministic Reel Identity</text>
    <circle cx="178" cy="22" r="4" fill="#10b981"/>
  </g>

  <!-- 3. Neon DB & Outbox -->
  <g class="node-card" transform="translate(130, 320)">
    <rect width="200" height="45" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <text x="15" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">3. Outbox Table &amp; DB</text>
    <text x="15" y="36" fill="#64748b" font-size="9.5">Transactional Integrity &amp; State</text>
    <rect x="135" y="14" width="53" height="16" rx="3" fill="#062b1e" stroke="#10b981" stroke-width="0.8"/>
    <text x="141" y="26" fill="#34d399" font-size="8.5" font-family="monospace">Pending</text>
  </g>

  <!-- 4. Async Context Worker -->
  <g class="node-card" transform="translate(130, 405)">
    <rect width="185" height="58" rx="6" fill="#0b0f19" stroke="#10b981" stroke-width="1.2"/>
    <text x="15" y="24" fill="#34d399" font-size="11.5" font-weight="700">4. Context Worker</text>
    <text x="15" y="39" fill="#94a3b8" font-size="9.5">Crawler Metadata Ingestion</text>
    <text x="15" y="51" fill="#64748b" font-size="8.5">Idempotent Outbox Consumer</text>
  </g>

  <!-- 5. Adaptive Gating & Embedding -->
  <g class="node-card" transform="translate(390, 405)">
    <rect width="180" height="58" rx="6" fill="#0d1117" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="12" y="21" fill="#60a5fa" font-size="11" font-weight="700">5. Adaptive Context Gate</text>
    <text x="12" y="35" fill="#34d399" font-size="8.5">Rich: Local Fast-Path (&lt;2ms)</text>
    <text x="12" y="49" fill="#fbbf24" font-size="8.5">Sparse: Gemini 2.5 Flash</text>
  </g>

  <!-- ==================== CENTRAL STORAGE: POSTGRESQL + PGVECTOR ==================== -->
  <g class="node-card" transform="translate(415, 275)">
    <rect width="130" height="65" rx="8" fill="#090d16" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="65" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" class="pulse-beacon"/>
    <text x="65" y="24" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="800">PostgreSQL</text>
    <text x="65" y="39" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="monospace">GIN (Lexical)</text>
    <text x="65" y="52" text-anchor="middle" fill="#34d399" font-size="9" font-family="monospace">HNSW (384-d)</text>
  </g>

  <!-- ==================== SEARCH PIPELINE (RIGHT) ==================== -->
  <!-- 1. Multi-tier Cache -->
  <g class="node-card" transform="translate(630, 160)">
    <rect width="200" height="45" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <text x="15" y="21" fill="#f1f5f9" font-size="11.5" font-weight="700">1. Multi-Tier Cache</text>
    <text x="15" y="35" fill="#64748b" font-size="9">L1 Memory (&lt;1ms) | L2 Redis (40ms)</text>
    <rect x="150" y="14" width="38" height="16" rx="3" fill="#062b1e" stroke="#10b981" stroke-width="0.8"/>
    <text x="156" y="26" fill="#34d399" font-size="8.5" font-family="monospace">0.0ms</text>
  </g>

  <!-- 2. Parallel Dual Retrieval -->
  <g class="node-card" transform="translate(630, 240)">
    <rect width="200" height="45" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <text x="15" y="21" fill="#f1f5f9" font-size="11.5" font-weight="700">2. Concurrent Retrieval</text>
    <text x="15" y="35" fill="#64748b" font-size="9">ThreadPool: FTS + MiniLM Vector</text>
    <circle cx="178" cy="22" r="4" fill="#f59e0b"/>
  </g>

  <!-- 3. RRF & Multi-Factor Reranker -->
  <g class="node-card" transform="translate(630, 320)">
    <rect width="200" height="55" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <text x="15" y="20" fill="#f1f5f9" font-size="11.5" font-weight="700">3. RRF &amp; Re-ranking</text>
    <text x="15" y="34" fill="#94a3b8" font-size="8.5">Score = 0.50 Sem + 0.30 Lex</text>
    <text x="15" y="47" fill="#64748b" font-size="8.5">+ 0.10 Entity + 0.05 Action/Env</text>
  </g>

  <!-- 4. Precision Confidence Gate -->
  <g class="node-card" transform="translate(630, 410)">
    <rect width="200" height="45" rx="6" fill="#0b0f19" stroke="#10b981" stroke-width="1.2"/>
    <text x="15" y="21" fill="#34d399" font-size="11.5" font-weight="700">4. Confidence Gate</text>
    <text x="15" y="35" fill="#94a3b8" font-size="9">Reject Weak Matches (&lt; 0.50)</text>
    <rect x="153" y="14" width="35" height="16" rx="3" fill="#143527" stroke="#10b981" stroke-width="0.8"/>
    <text x="158" y="26" fill="#34d399" font-size="8.5" font-family="monospace">Gate</text>
  </g>

  <!-- 5. Top 4 High Precision Results -->
  <g class="node-card" transform="translate(630, 485)">
    <rect width="200" height="34" rx="6" fill="#0d1117" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.5">MAXIMUM 4 RESULTS</text>
  </g>
</svg>
